<text x="355" y="224" text-anchor="middle" font-size="14" fill="#4b5563">heat source inside</text>
<circle cx="500" cy="275" r="22" fill="#fecaca"/><text x="500" y="281" text-anchor="middle" font-size="13" fill="#7f1d1d">heat</text>
