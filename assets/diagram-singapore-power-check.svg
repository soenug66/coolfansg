<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Inter,Arial,sans-serif">
<rect width="800" height="420" fill="#f8fafc"/>
<g font-size="15" fill="#111827" text-anchor="middle">
<rect x="20" y="40" width="170" height="120" rx="14" fill="#fff" stroke="#9ca3af" stroke-width="2"/>
<text x="105" y="70" font-weight="700">Singapore socket</text><text x="105" y="95" fill="#4b5563">230V &#183; 50Hz</text><text x="105" y="118" fill="#4b5563">Type G (3-pin)</text>
<rect x="75" y="128" width="12" height="22" fill="#374151"/><rect x="123" y="128" width="12" height="22" fill="#374151"/><rect x="99" y="124" width="12" height="14" fill="#374151"/>
<rect x="240" y="40" width="170" height="120" rx="14" fill="#fff" stroke="#9ca3af" stroke-width="2"/>
<text x="325" y="70" font-weight="700">Plug on the unit</text><text x="325" y="95" fill="#4b5563">must fit Type G</text><text x="325" y="118" fill="#4b5563">or a safe adaptor</text>
<rect x="460" y="40" width="170" height="120" rx="14" fill="#fff" stroke="#9ca3af" stroke-width="2"/>
<text x="545" y="70" font-weight="700">Power unit</text><text x="545" y="95" fill="#4b5563">input must cover 230V</text><text x="545" y="118" fill="#4b5563">output 12V DC + dial</text>
<rect x="670" y="40" width="110" height="120" rx="14" fill="#fff" stroke="#9ca3af" stroke-width="2"/>
<text x="725" y="70" font-weight="700">Fan</text><text x="725" y="95" fill="#4b5563">12V DC</text><text x="725" y="118" fill="#4b5563">250mm</text>
</g>
<g stroke="#374151" stroke-width="3" fill="none"><path d="M190 100h50M410 100h50M630 100h40"/></g>
<g fill="#374151"><path d="M240 100l-10-6v12zM460 100l-10-6v12zM670 100l-10-6v12z"/></g>
<g font-size="16">
<rect x="20" y="200" width="760" height="56" rx="12" fill="#dcfce7" stroke="#16a34a"/>
<text x="40" y="234" fill="#14532d" font-weight="700">OK:  unit input 220V or 230V (or 100&#8211;240V)  +  Type G plug or quality adaptor</text>
<rect x="20" y="272" width="760" height="56" rx="12" fill="#fee2e2" stroke="#dc2626"/>
<text x="40" y="306" fill="#7f1d1d" font-weight="700">Avoid:  110V / 115V power unit on Singapore mains</text>
<rect x="20" y="344" width="760" height="56" rx="12" fill="#fee2e2" stroke="#dc2626"/>
<text x="40" y="378" fill="#7f1d1d" font-weight="700">Avoid:  forcing a flat 2-pin plug, stacked adaptors, cutting and re-wiring a plug</text>
